<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="793" viewBox="0 0 1200 793" role="img" aria-labelledby="tool-map-title tool-map-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="tool-map-title">Two ways in, one configuration file</title>
<desc id="tool-map-desc">Diagram: you run the commands, or ru-build runs generate_matrix.py and then build_app.sh in CI; the commands load settings through config_loader.sh, build_app.sh asks get_app_info.py for the source file, the commands run idf.py, and config_loader.sh, get_app_info.py and generate_matrix.py all read app_config.yml.</desc>
