<text x="56" y="184.4" font-size="20" font-weight="700" fill="#0B5F59">You, in a terminal</text>
<text x="56" y="215" font-size="17" fill="#2B3442">build, flash, monitor</text>
<text x="861.3" y="184.4" font-size="20" font-weight="700" fill="#334155">ci-tools ru-build</text>
<text x="861.3" y="215" font-size="17" fill="#2B3442">on every push</text>
