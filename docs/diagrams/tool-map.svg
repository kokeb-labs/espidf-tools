<text x="56" y="368.5" font-size="16" font-weight="700" fill="#7A360E">build_app.sh</text>
<rect x="178.2" y="350.4" width="122.3" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="186.2" y="368.5" font-size="16" font-weight="700" fill="#7A360E">flash_app.sh</text>
<rect x="308.4" y="350.4" width="138.4" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="316.4" y="368.5" font-size="16" font-weight="700" fill="#7A360E">manage_idf.sh</text>
<rect x="454.8" y="350.4" width="185.7" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="462.8" y="368.5" font-size="16" font-weight="700" fill="#7A360E">idf_flash_monitor.sh</text>
<text x="48" y="334.4" font-size="17" font-weight="700" fill="#7A360E">COMMANDS</text>
<text x="861.3" y="340.4" font-size="20" font-weight="700" fill="#7A360E">generate_matrix.py</text>
<text x="861.3" y="371" font-size="17" fill="#2B3442">one CI job per app,</text>
<text x="861.3" y="395.7" font-size="17" fill="#2B3442">IDF version, build type</text>
<text x="56" y="520.4" font-size="20" font-weight="700" fill="#7A360E">config_loader.sh</text>
<text x="56" y="551" font-size="17" fill="#2B3442">yq, or a grep fallback</text>
<text x="458.7" y="520.4" font-size="20" font-weight="700" fill="#7A360E">get_app_info.py</text>
<text x="458.7" y="551" font-size="17" fill="#2B3442">an app's source file</text>
<text x="861.3" y="520.4" font-size="20" font-weight="700" fill="#334155">idf.py</text>
<text x="861.3" y="551" font-size="17" fill="#2B3442">ESP-IDF in ~/esp</text>
<text x="56" y="676.4" font-size="20" font-weight="700" fill="#0B5F59">app_config.yml</text>
<text x="56" y="707" font-size="17" fill="#2B3442">apps, ESP-IDF versions, build types and target, in your ESP-IDF project</text>
