---
# Behaviour tests of the shell and Python scripts (tests/test_scripts.sh) with GNU tools (Ubuntu) and BSD tools
# and bash 3.2 (macOS). No ESP-IDF install; each job takes well under a minute.
# Called by ci-docs-publish.yml, whose CI gate requires it whenever a script or test changed.
name: 🧪 Script tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Script tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Tool versions
        run: |
          /bin/bash --version | head -1
          stat --version 2>/dev/null | head -1 || echo "stat: BSD"
          # GNU find prints its version; BSD find has no --version and no default path.
          # shellcheck disable=SC2185
          find --version 2>/dev/null | head -1 || echo "find: BSD"

      - name: Run tests
        run: /bin/bash tests/test_scripts.sh
